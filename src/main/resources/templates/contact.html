<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — SEU Student Blog</title>
  <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('contact')}"></div>

<section class="section">
  <div class="wrap" style="max-width:600px">
    <span class="eyebrow">Contact</span>
    <h1 style="margin:10px 0 16px">Get in touch</h1>
    <p style="color:var(--ink-soft);font-size:16.5px;margin-bottom:28px">Have a question or suggestion? We'd love to hear from you.</p>
    <form method="post" th:action="@{/contact}" class="contact-form">
      <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
      <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text"></div>
      <div class="field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Send Message</button>
    </form>
  </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
