<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — SEU Student Blog Admin</title>
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" th:replace="~{admin/fragments/sidebar :: sidebar('dashboard')}"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Dashboard</h1>
      <a th:href="@{/admin/blogs/create}" class="btn btn-primary">+ Create New Post</a>
    </div>

    <div class="stat-cards">
      <div class="stat-card"><div class="num" th:text="${recentBlogs.size()}">0</div><div class="label">Recent Blogs</div></div>
      <div class="stat-card"><div class="num">—</div><div class="label">Categories</div></div>
      <div class="stat-card"><div class="num">—</div><div class="label">Published</div></div>
      <div class="stat-card"><div class="num">—</div><div class="label">Drafts</div></div>
    </div>

    <h2 style="font-size:19px;margin-bottom:16px">Recent Posts</h2>
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Category</th><th>Author</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        <tr th:each="b : ${recentBlogs}">
          <td th:text="${b.title}">Title</td>
          <td th:text="${b.category}">Category</td>
          <td th:text="${b.author}">Author</td>
          <td><span class="badge" th:classappend="${b.status.name() == 'DRAFT'} ? 'badge-draft' : 'badge-published'" th:text="${b.status}">Status</span></td>
          <td class="action-links">
            <a th:href="@{/blogs/{slug}(slug=${b.slug})}">View</a>
            <a th:href="@{/admin/blogs/{id}/edit(id=${b.id})}">Edit</a>
            <form th:action="@{/admin/blogs/{id}/delete(id=${b.id})}" method="post" style="display:inline">
              <button type="submit" class="danger" style="background:none;border:none;cursor:pointer;font:inherit">Delete</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
